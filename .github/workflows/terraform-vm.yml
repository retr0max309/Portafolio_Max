name: Terraform y VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portafolio-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/all-tests.yml

  infrastructure:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      instance_ocid: ${{ steps.outputs.outputs.instance_ocid }}
      public_ip: ${{ steps.outputs.outputs.public_ip }}
    env:
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      TF_VAR_tenancy_ocid: ${{ vars.OCI_TENANCY_OCID }}
      TF_VAR_compartment_ocid: ${{ vars.OCI_TENANCY_OCID }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_image_ocid: ${{ vars.UBUNTU_IMAGE_OCID }}
      TF_VAR_ssh_ingress_cidr: ${{ vars.SSH_INGRESS_CIDR }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Preparar autenticación OCI
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          printf '%s' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci_api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"
          echo "OCI_PRIVATE_KEY_PATH=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.oci"
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_USER_OCID"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'region=%s\n' "$OCI_REGION"
            printf 'key_file=%s\n' "$RUNNER_TEMP/oci_api_key.pem"
          } > "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"
      - name: Inicializar estado remoto y validar
        run: |
          terraform init -input=false
          terraform fmt -check
          terraform validate
      - name: Planificar infraestructura
        run: terraform plan -input=false -out=tfplan
      - name: Impedir eliminación o reemplazo automático
        run: |
          if terraform show -json tfplan | jq -e '[.resource_changes[]? | select(.change.actions | index("delete"))] | length > 0' >/dev/null; then
            echo 'El plan elimina o reemplaza recursos. Se detiene el despliegue.' >&2
            exit 1
          fi
      - name: Aplicar infraestructura
        run: terraform apply -input=false -auto-approve tfplan
      - name: Publicar salidas de Terraform
        id: outputs
        run: |
          echo "instance_ocid=$(terraform output -raw instance_ocid)" >> "$GITHUB_OUTPUT"
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

  publish:
    needs: infrastructure
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publicar imagen de NestJS
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/portafolio-api:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/portafolio-api:latest
      - name: Publicar imagen de Next.js
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/portafolio-web:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/portafolio-web:latest

  deploy:
    needs: [infrastructure, publish]
    runs-on: ubuntu-24.04
    env:
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
      OCI_REGION: ${{ vars.OCI_REGION }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar SDK de OCI
        run: python -m pip install oci==2.192.0
      - name: Preparar autenticación OCI
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
        run: |
          printf '%s' "$OCI_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/oci_api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"
          echo "OCI_PRIVATE_KEY_PATH=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"
      - name: Desplegar imágenes con OCI Run Command
        run: >-
          python scripts/oci-deploy.py
          --instance-id '${{ needs.infrastructure.outputs.instance_ocid }}'
          --compartment-id '${{ vars.OCI_TENANCY_OCID }}'
          --tag 'sha-${{ github.sha }}'
      - name: Comprobar página pública
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "http://${{ needs.infrastructure.outputs.public_ip }}/" > /dev/null
