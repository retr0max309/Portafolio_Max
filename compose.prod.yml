name: portafolio-prod

services:
  api:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME}/portafolio-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env.production
    environment:
      DATABASE_PROVIDER: supabase
      PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  web:
    image: ${DOCKERHUB_USERNAME:?Define DOCKERHUB_USERNAME}/portafolio-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_INTERNAL_URL: http://api:3001
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-80}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
